backend:
  name: github
  repo: te-sa/bar-uno-astro
  branch: main

media_folder: /public/media
public_folder: /media

singletons:
  - name: daily-menu
    label: Tageskarte
    file: /src/content/tageskarte.md
    fields:
      - { label: "Titel der Karte", name: title, widget: string }
      - label: Tagesgerichte
        name: items
        widget: list
        summary: "{{fields.name}} - {{fields.price}}"
        fields:
          - { label: Gericht, name: name, widget: string }
          - { label: Allergene, name: allergens, widget: string, required: false, hint: "z.B. A,g, vegetarisch" }
          - { label: Preis, name: price, widget: string, hint: "z.B. 12,50" }
          - { label: "Zusatzinfo / Kommentar", name: comment, widget: text, required: false, hint: "Optional: Beilagen oder Beschreibung" }
  - name: privacy-policy
    label: Datenschutz
    file: /src/content/datenschutz.md
    fields:
      - { label: "Titel", name: title, widget: string }
      - { label: "Inhalt", name: body, widget: markdown }
  - name: site-notice
    label: Impressum
    file: /src/content/impressum.md
    fields:
      - { label: "Titel", name: title, widget: string }
      - { label: "Inhalt", name: body, widget: markdown }
  - name: allergens
    label: Allergen Liste
    file: /src/content/allergene.md
    fields:
      - { label: "Titel", name: title, widget: string }
      - { label: "Kommentar unter dem Titel", name: comment, widget: text, required: false }
      - label: Allergene
        name: items
        widget: list
        summary: "{{fields.code}} — {{fields.label}}"
        fields:
          - { label: Code, name: code, widget: string, hint: "z.B. A oder 10" }
          - { label: Bedeutung, name: label, widget: string }
  - name: google-reviews
    label: Google Reviews
    file: /src/content/google-reviews.md
    fields:
      - { label: "Bewertungstext", name: ratingLabel, widget: string, hint: "z.B. 4,6 Sterne bei Google" }
      - label: Reviews
        name: items
        widget: list
        summary: "{{fields.stars}}★ — {{fields.text}}"
        fields:
          - { label: Text, name: text, widget: text }
          - { label: Sterne, name: stars, widget: number, min: 1, max: 5, value_type: int, default: 5 }
  - name: hero-banner
    label: Banner
    file: /src/content/hero-banner.md
    fields:
      - { label: Text, name: text, widget: text, hint: "Kurze Ankündigung für die Startseite" }
      - label: Farbe
        name: color
        widget: select
        options:
          - { label: "Ankündigung (Grün)", value: announcement }
          - { label: "Hinweis (Orange)", value: warning }
        default: announcement
      - { label: "Sichtbar ab", name: startDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Leer lassen = sofort sichtbar" }
      - { label: "Sichtbar bis", name: endDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Leer lassen = unbegrenzt sichtbar" }

collections:
  - name: menu
    label: Karte
    label_singular: Kartenabschnitt
    folder: /src/content/menu
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Titel", name: title, widget: string }
      - { label: "Reihenfolge", name: order, widget: number, required: false }
      - { label: "Kommentar unter dem Titel", name: comment, widget: text, required: false }
      - { label: "Hinweis am Ende", name: note, widget: text, required: false }
      - label: Abschnitte
        name: sections
        widget: list
        summary: "{{fields.title}}"
        fields:
          - { label: "Abschnitts-Titel", name: title, widget: string, required: false }
          - { label: "Kommentar unter dem Abschnitts-Titel", name: comment, widget: text, required: false }
          - { label: "Hinweis unter den Items", name: note, widget: text, required: false }
          - label: Items
            name: items
            widget: list
            summary: "{{fields.name}} - {{fields.price}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Allergene, name: allergens, widget: string, required: false, hint: "z.B. A,g, vegetarisch" }
              - { label: Preis, name: price, widget: string, hint: "z.B. 12,50 oder 3,50 / 6,50" }
              - { label: "Zusatzinfo / Kommentar", name: comment, widget: text, required: false, hint: "Optional: Zutaten oder Beschreibung" }
